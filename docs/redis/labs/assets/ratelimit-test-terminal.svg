<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1089" viewBox="0 0 860 1089" role="img" aria-labelledby="title desc">
  <title id="title">make test: sliding-window holds</title>
  <desc id="desc">Terminal screenshot generated from an actual Redis rate-limit lab run.</desc>
  <rect width="860" height="1089" rx="14" fill="#0b1018"/>
  <rect x="1" y="1" width="858" height="1087" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="88" y="30" fill="#8b949e" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">make test: sliding-window holds</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="24" y="54" fill="#58a6ff">== Rate limit test: sliding-window limiter ==</text><text x="24" y="73" fill="#d6deeb">What will happen: same boundary timing, but requests are counted in a rolling window.</text><text x="24" y="92" fill="#e3b341">Watch for: phase-2 requests denied because phase-1 entries are still recent.</text><text x="24" y="111" fill="#d6deeb">Result to review: total allowed stays within the limit, so this exits 0.</text><text x="24" y="130" fill="#d6deeb"></text><text x="24" y="149" fill="#d6deeb"></text><text x="24" y="168" fill="#58a6ff">===========================================================</text><text x="24" y="187" fill="#58a6ff">  REDIS RATE LIMIT LAB — BOUNDARY BURST</text><text x="24" y="206" fill="#d6deeb">  mode=sliding     limit=8/window  window=10s</text><text x="24" y="225" fill="#58a6ff">===========================================================</text><text x="24" y="244" fill="#d6deeb"></text><text x="24" y="263" fill="#d6deeb">  scenario: 8 requests before boundary, 8 after — same 400ms real-time span</text><text x="24" y="282" fill="#e3b341">  fixed-window: counter resets → both bursts allowed (2× limit)</text><text x="24" y="301" fill="#d6deeb">  sliding-window: phase-1 entries still counted → phase-2 rejected</text><text x="24" y="320" fill="#d6deeb"></text><text x="24" y="339" fill="#d6deeb">  next window boundary at 11:29:30</text><text x="24" y="358" fill="#e3b341">[      0ms]   waiting 7.273s to same boundary point as fixed-window test...</text><text x="24" y="377" fill="#d6deeb"></text><text x="24" y="396" fill="#58a6ff">--- phase 1: 8 requests BEFORE boundary ---</text><text x="24" y="415" fill="#d6deeb"></text><text x="24" y="434" fill="#7ee787">[   7285ms]   ALLOW  req=1    window-count=1/8</text><text x="24" y="453" fill="#7ee787">[   7285ms]   ALLOW  req=2    window-count=2/8</text><text x="24" y="472" fill="#7ee787">[   7285ms]   ALLOW  req=3    window-count=3/8</text><text x="24" y="491" fill="#7ee787">[   7285ms]   ALLOW  req=4    window-count=4/8</text><text x="24" y="510" fill="#7ee787">[   7286ms]   ALLOW  req=5    window-count=5/8</text><text x="24" y="529" fill="#7ee787">[   7286ms]   ALLOW  req=6    window-count=6/8</text><text x="24" y="548" fill="#7ee787">[   7286ms]   ALLOW  req=7    window-count=7/8</text><text x="24" y="567" fill="#7ee787">[   7286ms]   ALLOW  req=8    window-count=8/8</text><text x="24" y="586" fill="#d6deeb"></text><text x="24" y="605" fill="#58a6ff">--- phase 2: 8 requests AFTER boundary ---</text><text x="24" y="624" fill="#d6deeb"></text><text x="24" y="643" fill="#e3b341">[   7679ms]   sliding window still contains phase-1 entries (only ~400ms old, window=10s)</text><text x="24" y="662" fill="#d6deeb"></text><text x="24" y="681" fill="#ff7b72">[   7679ms]   DENY   burst=1    window-count=8/8  (phase-1 still counted)</text><text x="24" y="700" fill="#ff7b72">[   7680ms]   DENY   burst=2    window-count=8/8  (phase-1 still counted)</text><text x="24" y="719" fill="#ff7b72">[   7680ms]   DENY   burst=3    window-count=8/8  (phase-1 still counted)</text><text x="24" y="738" fill="#ff7b72">[   7680ms]   DENY   burst=4    window-count=8/8  (phase-1 still counted)</text><text x="24" y="757" fill="#ff7b72">[   7680ms]   DENY   burst=5    window-count=8/8  (phase-1 still counted)</text><text x="24" y="776" fill="#ff7b72">[   7680ms]   DENY   burst=6    window-count=8/8  (phase-1 still counted)</text><text x="24" y="795" fill="#ff7b72">[   7681ms]   DENY   burst=7    window-count=8/8  (phase-1 still counted)</text><text x="24" y="814" fill="#ff7b72">[   7681ms]   DENY   burst=8    window-count=8/8  (phase-1 still counted)</text><text x="24" y="833" fill="#d6deeb"></text><text x="24" y="852" fill="#58a6ff">======================= RESULTS ========================</text><text x="24" y="871" fill="#d6deeb">  phase-1 allowed : 8  (before boundary)</text><text x="24" y="890" fill="#d6deeb">  phase-2 allowed : 0  (after boundary)</text><text x="24" y="909" fill="#d6deeb">  phase-2 denied  : 8</text><text x="24" y="928" fill="#d6deeb">  total in ~400ms span: 8  (limit=8)</text><text x="24" y="947" fill="#d6deeb"></text><text x="24" y="966" fill="#58a6ff">================== INVARIANT CHECK ====================</text><text x="24" y="985" fill="#d6deeb">  burst=8  limit=8  mode=sliding</text><text x="24" y="1004" fill="#d6deeb"></text><text x="24" y="1023" fill="#7ee787">  ✓ PASSED  sliding window held: 8 total in ~400ms (limit=8)</text><text x="24" y="1042" fill="#d6deeb">  phase-1 entries still in window prevented phase-2 burst</text>
  </g>
</svg>
