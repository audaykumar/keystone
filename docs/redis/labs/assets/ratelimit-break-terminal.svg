<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1127" viewBox="0 0 860 1127" role="img" aria-labelledby="title desc">
  <title id="title">make break: fixed-window burst</title>
  <desc id="desc">Terminal screenshot generated from an actual Redis rate-limit lab run.</desc>
  <rect width="860" height="1127" rx="14" fill="#0b1018"/>
  <rect x="1" y="1" width="858" height="1125" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="88" y="30" fill="#8b949e" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">make break: fixed-window burst</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="24" y="54" fill="#58a6ff">== Rate limit break: fixed-window boundary burst ==</text><text x="24" y="73" fill="#d6deeb">What will happen: one burst lands before a window boundary and another just after it.</text><text x="24" y="92" fill="#e3b341">Watch for: both phases allowed because the fixed counter resets at the boundary.</text><text x="24" y="111" fill="#d6deeb">Result to review: total allowed in the short span exceeds the limit, so this exits 1.</text><text x="24" y="130" fill="#d6deeb"></text><text x="24" y="149" fill="#d6deeb"></text><text x="24" y="168" fill="#58a6ff">===========================================================</text><text x="24" y="187" fill="#58a6ff">  REDIS RATE LIMIT LAB — BOUNDARY BURST</text><text x="24" y="206" fill="#d6deeb">  mode=fixed       limit=8/window  window=10s</text><text x="24" y="225" fill="#58a6ff">===========================================================</text><text x="24" y="244" fill="#d6deeb"></text><text x="24" y="263" fill="#d6deeb">  scenario: 8 requests before boundary, 8 after — same 400ms real-time span</text><text x="24" y="282" fill="#e3b341">  fixed-window: counter resets → both bursts allowed (2× limit)</text><text x="24" y="301" fill="#d6deeb">  sliding-window: phase-1 entries still counted → phase-2 rejected</text><text x="24" y="320" fill="#d6deeb"></text><text x="24" y="339" fill="#d6deeb">  next window boundary at 11:29:10</text><text x="24" y="358" fill="#e3b341">[      0ms]   waiting 4.022s to reach boundary...</text><text x="24" y="377" fill="#d6deeb"></text><text x="24" y="396" fill="#58a6ff">--- phase 1: 8 requests BEFORE window boundary ---</text><text x="24" y="415" fill="#d6deeb"></text><text x="24" y="434" fill="#7ee787">[   4037ms]   ALLOW  req=1    count=1/8  window-resets-in=1s</text><text x="24" y="453" fill="#7ee787">[   4037ms]   ALLOW  req=2    count=2/8  window-resets-in=1s</text><text x="24" y="472" fill="#7ee787">[   4037ms]   ALLOW  req=3    count=3/8  window-resets-in=1s</text><text x="24" y="491" fill="#7ee787">[   4037ms]   ALLOW  req=4    count=4/8  window-resets-in=1s</text><text x="24" y="510" fill="#7ee787">[   4037ms]   ALLOW  req=5    count=5/8  window-resets-in=1s</text><text x="24" y="529" fill="#7ee787">[   4038ms]   ALLOW  req=6    count=6/8  window-resets-in=1s</text><text x="24" y="548" fill="#7ee787">[   4038ms]   ALLOW  req=7    count=7/8  window-resets-in=1s</text><text x="24" y="567" fill="#7ee787">[   4038ms]   ALLOW  req=8    count=8/8  window-resets-in=1s</text><text x="24" y="586" fill="#d6deeb">[   4038ms]</text><text x="24" y="605" fill="#e3b341">  waiting 200ms past boundary — fixed window resets NOW...</text><text x="24" y="624" fill="#d6deeb"></text><text x="24" y="643" fill="#58a6ff">--- phase 2: 8 requests AFTER window boundary (burst) ---</text><text x="24" y="662" fill="#d6deeb"></text><text x="24" y="681" fill="#e3b341">[   4424ms]   fixed window counter reset to 0 — new window open</text><text x="24" y="700" fill="#d6deeb"></text><text x="24" y="719" fill="#7ee787">[   4425ms]   ALLOW  burst=1    count=1/8  window-resets-in=10s</text><text x="24" y="738" fill="#7ee787">[   4425ms]   ALLOW  burst=2    count=2/8  window-resets-in=10s</text><text x="24" y="757" fill="#7ee787">[   4425ms]   ALLOW  burst=3    count=3/8  window-resets-in=10s</text><text x="24" y="776" fill="#7ee787">[   4426ms]   ALLOW  burst=4    count=4/8  window-resets-in=10s</text><text x="24" y="795" fill="#7ee787">[   4426ms]   ALLOW  burst=5    count=5/8  window-resets-in=10s</text><text x="24" y="814" fill="#7ee787">[   4426ms]   ALLOW  burst=6    count=6/8  window-resets-in=10s</text><text x="24" y="833" fill="#7ee787">[   4426ms]   ALLOW  burst=7    count=7/8  window-resets-in=10s</text><text x="24" y="852" fill="#7ee787">[   4426ms]   ALLOW  burst=8    count=8/8  window-resets-in=10s</text><text x="24" y="871" fill="#d6deeb"></text><text x="24" y="890" fill="#58a6ff">======================= RESULTS ========================</text><text x="24" y="909" fill="#d6deeb">  phase-1 allowed : 8  (before boundary)</text><text x="24" y="928" fill="#d6deeb">  phase-2 allowed : 8  (after boundary)</text><text x="24" y="947" fill="#d6deeb">  phase-2 denied  : 0</text><text x="24" y="966" fill="#d6deeb">  total in ~400ms span: 16  (limit=8)</text><text x="24" y="985" fill="#d6deeb"></text><text x="24" y="1004" fill="#58a6ff">================== INVARIANT CHECK ====================</text><text x="24" y="1023" fill="#d6deeb">  burst=16  limit=8  mode=fixed</text><text x="24" y="1042" fill="#d6deeb"></text><text x="24" y="1061" fill="#ff7b72">  ✗ FAILED  fixed-window burst: 16 requests in ~400ms span (limit=8)</text><text x="24" y="1080" fill="#e3b341">  counter reset at boundary allowed phase-2 as a fresh window</text>
  </g>
</svg>
