<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Poison message: infinite requeue loop versus the dead-letter escape</title>
  <desc id="desc">Left panel: without a dead-letter target, a poison message is nacked with requeue, redelivered, fails again, and repeats forever, occupying a prefetch slot a good message could use. Right panel: with a retry-count guard and a dead-letter exchange, the same poison message is retried a bounded number of times, then nacked without requeue and routed to a dead-letter queue, leaving the main queue free to drain.</desc>
  <defs>
    <marker id="arrowBad2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
    <marker id="arrowWarn2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/>
    </marker>
    <marker id="arrowGood2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .muted { fill: #9ba7b4; }
      .small { font-size: 14px; }
      .label { font-size: 17px; font-weight: 700; }
      .title { font-size: 26px; font-weight: 750; }
      .panelTitle { font-size: 19px; font-weight: 700; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .bad { fill: #2d1b1e; stroke: #ff7b72; stroke-width: 2; }
      .warn { fill: #2a2416; stroke: #e3b341; stroke-width: 2; }
      .good { fill: #14251d; stroke: #56d364; stroke-width: 2; }
      .loopEdge { stroke: #ff7b72; stroke-width: 3; marker-end: url(#arrowBad2); fill: none; }
      .retryEdge { stroke: #e3b341; stroke-width: 3; marker-end: url(#arrowWarn2); fill: none; }
      .escapeEdge { stroke: #56d364; stroke-width: 3; marker-end: url(#arrowGood2); fill: none; }
      .divider { stroke: #30363d; stroke-width: 2; stroke-dasharray: 4 6; }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#0d1117"/>
  <text class="title" x="44" y="46">Poison message: stuck forever, or bounded and parked</text>
  <line class="divider" x1="550" y1="70" x2="550" y2="590"/>

  <!-- LEFT PANEL: infinite loop -->
  <text class="panelTitle" x="60" y="90" fill="#ff7b72">No dead-letter target</text>

  <rect class="box" x="60" y="130" width="200" height="90" rx="12"/>
  <text class="label" x="82" y="164">work.queue</text>
  <text class="small muted" x="82" y="188">poison at the front</text>

  <rect class="bad" x="60" y="330" width="200" height="90" rx="12"/>
  <text class="label" x="82" y="364">Consumer</text>
  <text class="small muted" x="82" y="388">tries, fails, nacks</text>

  <path class="loopEdge" d="M 160 220 C 180 260, 180 300, 160 328"/>
  <text class="small" x="185" y="270">deliver</text>
  <path class="loopEdge" d="M 160 330 C 100 300, 100 260, 160 222"/>
  <text class="small" x="30" y="270" fill="#ff7b72">nack(requeue=true)</text>

  <text class="small muted" x="60" y="450">Redelivered every cycle. With a small</text>
  <text class="small muted" x="60" y="470">prefetch, this occupies a slot a good</text>
  <text class="small muted" x="60" y="490">message needed &#8594; head-of-line block.</text>
  <text class="small" x="60" y="520" fill="#ff7b72">redelivery count climbs, uncapped</text>
  <text class="small" x="60" y="544" fill="#ff7b72">by anything the broker enforces</text>

  <!-- RIGHT PANEL: bounded retry then DLQ -->
  <text class="panelTitle" x="590" y="90" fill="#56d364">Retry-count guard + dead-letter exchange</text>

  <rect class="box" x="590" y="130" width="190" height="80" rx="12"/>
  <text class="label" x="610" y="162">work.queue</text>
  <text class="small muted" x="610" y="184">x-dead-letter-exchange</text>

  <rect class="warn" x="590" y="300" width="190" height="90" rx="12"/>
  <text class="label" x="610" y="332">Consumer</text>
  <text class="small muted" x="610" y="354">x-retry-count: 0,1,2</text>
  <text class="small muted" x="610" y="374">attempt &lt; N &#8594; republish</text>

  <path class="retryEdge" d="M 685 210 C 700 240, 700 270, 685 298"/>
  <text class="small" x="705" y="250" fill="#e3b341">deliver, attempt++</text>
  <path class="retryEdge" d="M 685 300 C 660 270, 660 240, 685 212"/>

  <rect class="bad" x="850" y="130" width="190" height="80" rx="12"/>
  <text class="label" x="870" y="162">lab.dlx</text>
  <text class="small muted" x="870" y="184">dead-letter exchange</text>

  <rect class="good" x="850" y="300" width="190" height="90" rx="12"/>
  <text class="label" x="870" y="334">work.dlq</text>
  <text class="small muted" x="870" y="356">depth = 1</text>
  <text class="small muted" x="870" y="376">held for inspection</text>

  <path class="escapeEdge" d="M 780 340 L 848 340"/>
  <text class="small" x="700" y="440" fill="#56d364">attempt == N &#8594; nack(requeue=false)</text>
  <path class="escapeEdge" d="M 945 300 L 945 210"/>
  <text class="small muted" x="600" y="470">Main queue drains to 0. The poison sits in</text>
  <text class="small muted" x="600" y="490">work.dlq, exactly once, instead of cycling.</text>
  <text class="small" x="600" y="520" fill="#56d364">redelivery count bounded by MAX_ATTEMPTS</text>
  <text class="small" x="600" y="544" fill="#56d364">operator sees a depth of 1, not a rate climbing</text>
</svg>
