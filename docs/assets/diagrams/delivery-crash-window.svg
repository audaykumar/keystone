<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Delivery semantics crash windows</title>
  <desc id="desc">Three message processing timelines comparing at-most-once, at-least-once, and idempotent effect behavior around a crash window.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ba7b4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .title { font-size: 28px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .muted { fill: #9ba7b4; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .bad { fill: #2d1b1e; stroke: #ff7b72; }
      .warn { fill: #2a2416; stroke: #e3b341; }
      .good { fill: #14251d; stroke: #56d364; }
      .step { fill: #202b38; stroke: #30363d; stroke-width: 2; rx: 10; }
      .line { stroke: #9ba7b4; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .crash { stroke: #ff7b72; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1120" height="650" fill="#0d1117"/>
  <text class="title" x="44" y="54">The crash window decides delivery behavior</text>
  <text class="muted small" x="44" y="84">A consumer has two duties: apply the effect and record progress.</text>

  <rect class="box bad" x="56" y="140" width="1010" height="130"/>
  <text class="label" x="84" y="176">At-most-once</text>
  <rect class="step" x="260" y="165" width="150" height="64"/><text class="small" x="288" y="203">commit offset</text>
  <path class="line" d="M410 197 H500"/>
  <line class="crash" x1="520" y1="160" x2="520" y2="234"/>
  <text class="small" x="538" y="203">crash</text>
  <path class="line" d="M600 197 H690"/>
  <rect class="step" x="700" y="165" width="170" height="64"/><text class="small" x="730" y="203">effect skipped</text>
  <text class="muted tiny" x="84" y="240">Progress is recorded first. Restart resumes after the message.</text>

  <rect class="box warn" x="56" y="300" width="1010" height="130"/>
  <text class="label" x="84" y="336">At-least-once</text>
  <rect class="step" x="260" y="325" width="150" height="64"/><text class="small" x="294" y="363">apply effect</text>
  <path class="line" d="M410 357 H500"/>
  <line class="crash" x1="520" y1="320" x2="520" y2="394"/>
  <text class="small" x="538" y="363">crash</text>
  <path class="line" d="M600 357 H690"/>
  <rect class="step" x="700" y="325" width="190" height="64"/><text class="small" x="730" y="363">effect repeats</text>
  <text class="muted tiny" x="84" y="400">Effect happened, but progress was not recorded. Restart replays the message.</text>

  <rect class="box good" x="56" y="460" width="1010" height="130"/>
  <text class="label" x="84" y="496">Idempotent effect</text>
  <rect class="step" x="250" y="485" width="230" height="64"/><text class="small" x="274" y="523">insert event id + effect</text>
  <path class="line" d="M480 517 H570"/>
  <line class="crash" x1="590" y1="480" x2="590" y2="554"/>
  <text class="small" x="608" y="523">crash</text>
  <path class="line" d="M670 517 H760"/>
  <rect class="step" x="770" y="485" width="190" height="64"/><text class="small" x="808" y="523">replay no-op</text>
  <text class="muted tiny" x="84" y="560">The duplicate check and side effect commit together, so retry is safe.</text>
</svg>
