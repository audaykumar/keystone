<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Expand migrate code contract migration sequence</title>
  <desc id="desc">A zero-downtime schema migration timeline showing expand, migrate code, backfill, validate, and contract phases with compatibility across old and new application versions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ba7b4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .title { font-size: 28px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .muted { fill: #9ba7b4; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .blue { fill: #142236; stroke: #58a6ff; }
      .green { fill: #14251d; stroke: #56d364; }
      .yellow { fill: #2a2416; stroke: #e3b341; }
      .red { fill: #2d1b1e; stroke: #ff7b72; }
      .line { stroke: #30363d; stroke-width: 2; }
      .arrow { stroke: #9ba7b4; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .compat { stroke: #56d364; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect width="1100" height="560" fill="#0d1117"/>
  <text class="title" x="44" y="54">Expand, migrate code, contract</text>
  <text class="muted small" x="44" y="84">The application must work against both schemas during rollout and rollback.</text>

  <line class="line" x1="90" y1="285" x2="1010" y2="285"/>
  <path class="arrow" d="M90 285 H1010"/>

  <rect class="box blue" x="70" y="145" width="180" height="108"/>
  <text class="label" x="104" y="178">1. Expand</text>
  <text class="small muted" x="94" y="208">add nullable shape</text>
  <text class="small muted" x="94" y="231">or NOT VALID rule</text>

  <rect class="box green" x="280" y="145" width="180" height="108"/>
  <text class="label" x="310" y="178">2. Code</text>
  <text class="small muted" x="304" y="208">read both shapes</text>
  <text class="small muted" x="304" y="231">or dual-write</text>

  <rect class="box yellow" x="490" y="145" width="180" height="108"/>
  <text class="label" x="518" y="178">3. Backfill</text>
  <text class="small muted" x="514" y="208">small batches</text>
  <text class="small muted" x="514" y="231">commit each batch</text>

  <rect class="box green" x="700" y="145" width="180" height="108"/>
  <text class="label" x="728" y="178">4. Validate</text>
  <text class="small muted" x="724" y="208">prove invariant</text>
  <text class="small muted" x="724" y="231">under weaker lock</text>

  <rect class="box red" x="910" y="145" width="150" height="108"/>
  <text class="label" x="940" y="178">5. Contract</text>
  <text class="small muted" x="932" y="208">remove old path</text>
  <text class="small muted" x="932" y="231">after rollback safe</text>

  <path class="compat" d="M130 360 C250 330, 430 330, 555 360 C680 390, 830 390, 970 360"/>
  <text class="label" x="392" y="398">Compatibility window</text>
  <text class="muted small" x="310" y="424">old app + new app may run together, and rollback may restore the old app</text>

  <rect class="box" x="120" y="455" width="850" height="58"/>
  <text class="small" x="150" y="491">Rule: each phase should be deployable, retryable, and safe to pause before moving to the next phase.</text>
</svg>
