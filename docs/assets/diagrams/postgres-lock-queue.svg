<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL lock queue during a schema migration</title>
  <desc id="desc">A timeline showing an old read transaction, an ALTER TABLE waiting for ACCESS EXCLUSIVE, and later reads and writes queued behind the waiting migration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba7b4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .muted { fill: #9ba7b4; }
      .small { font-size: 16px; }
      .label { font-size: 18px; font-weight: 700; }
      .title { font-size: 28px; font-weight: 750; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .good { fill: #14251d; stroke: #56d364; }
      .warn { fill: #2a2416; stroke: #e3b341; }
      .bad { fill: #2d1b1e; stroke: #ff7b72; }
      .line { stroke: #30363d; stroke-width: 2; }
      .arrow { stroke: #9ba7b4; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .wait { stroke: #ff7b72; stroke-width: 4; stroke-dasharray: 9 7; fill: none; }
      .grant { stroke: #56d364; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#0d1117"/>
  <text class="title" x="44" y="54">Lock queue: why a waiting migration blocks later traffic</text>
  <text class="muted small" x="44" y="84">Key idea: queue fairness makes later compatible work wait behind the earlier strong lock request.</text>

  <line class="line" x1="165" y1="130" x2="165" y2="540"/>
  <line class="line" x1="430" y1="130" x2="430" y2="540"/>
  <line class="line" x1="705" y1="130" x2="705" y2="540"/>
  <line class="line" x1="955" y1="130" x2="955" y2="540"/>

  <text class="label" x="108" y="122">Session 1</text>
  <text class="muted small" x="86" y="146">old SELECT</text>
  <text class="label" x="365" y="122">Session 2</text>
  <text class="muted small" x="350" y="146">ALTER TABLE</text>
  <text class="label" x="646" y="122">Session 3</text>
  <text class="muted small" x="628" y="146">new traffic</text>
  <text class="label" x="892" y="122">Lock queue</text>
  <text class="muted small" x="868" y="146">table-level locks</text>

  <rect class="box warn" x="52" y="185" width="226" height="80"/>
  <text class="label" x="78" y="217">ACCESS SHARE held</text>
  <text class="muted small" x="78" y="244">read transaction stays open</text>
  <path class="arrow" d="M 278 225 H 884"/>
  <rect class="box warn" x="835" y="190" width="240" height="70"/>
  <text class="label" x="864" y="220">reader is first</text>
  <text class="muted small" x="864" y="244">weak lock granted</text>

  <rect class="box bad" x="320" y="306" width="220" height="86"/>
  <text class="label" x="344" y="338">ACCESS EXCLUSIVE</text>
  <text class="muted small" x="344" y="365">schema change waits</text>
  <path class="wait" d="M 540 350 H 835"/>
  <rect class="box bad" x="835" y="310" width="240" height="80"/>
  <text class="label" x="866" y="340">strong waiter</text>
  <text class="muted small" x="866" y="364">blocks later requests</text>

  <rect class="box good" x="590" y="422" width="230" height="86"/>
  <text class="label" x="616" y="454">SELECT / INSERT</text>
  <text class="muted small" x="616" y="481">compatible with old reader</text>
  <path class="wait" d="M 820 466 H 955 V 392"/>
  <text class="muted small" x="850" y="500">queues behind ALTER</text>

  <path class="grant" d="M 165 265 V 520 H 430 V 392"/>
  <rect class="box good" x="314" y="510" width="232" height="64"/>
  <text class="label" x="344" y="548">lock granted after reader ends</text>

  <rect class="box" x="44" y="575" width="1012" height="1" opacity="0"/>
  <text class="muted small" x="44" y="588">Safe migration behavior: set lock_timeout, fail fast, retry later instead of holding this queue open.</text>
</svg>
