<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Kafka log segments, retention, and compaction</title>
  <desc id="desc">A Kafka partition log split into segments showing active segment append, closed segments, delete retention, compacted keys, and tombstones.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ba7b4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .title { font-size: 28px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .muted { fill: #9ba7b4; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .segment { fill: #142236; stroke: #58a6ff; stroke-width: 2; rx: 10; }
      .closed { fill: #202b38; stroke: #30363d; }
      .active { fill: #14251d; stroke: #56d364; }
      .delete { fill: #2d1b1e; stroke: #ff7b72; }
      .compact { fill: #2a2416; stroke: #e3b341; }
      .record { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4; }
      .line { stroke: #9ba7b4; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect width="1100" height="560" fill="#0d1117"/>
  <text class="title" x="44" y="54">Partition log as segments</text>
  <text class="muted small" x="44" y="84">Kafka appends to the active segment. Retention and compaction work on closed log data.</text>

  <text class="label" x="72" y="145">Append path</text>
  <path class="line" d="M75 260 H1010"/>

  <rect class="segment closed" x="82" y="185" width="210" height="132"/>
  <text class="label" x="118" y="216">segment 0000</text>
  <text class="muted tiny" x="122" y="241">closed</text>
  <rect class="record" x="112" y="258" width="34" height="30"/><rect class="record" x="152" y="258" width="34" height="30"/><rect class="record" x="192" y="258" width="34" height="30"/><rect class="record" x="232" y="258" width="34" height="30"/>

  <rect class="segment closed" x="330" y="185" width="210" height="132"/>
  <text class="label" x="366" y="216">segment 0001</text>
  <text class="muted tiny" x="370" y="241">closed</text>
  <rect class="record" x="360" y="258" width="34" height="30"/><rect class="record" x="400" y="258" width="34" height="30"/><rect class="record" x="440" y="258" width="34" height="30"/><rect class="record" x="480" y="258" width="34" height="30"/>

  <rect class="segment active" x="578" y="185" width="210" height="132"/>
  <text class="label" x="620" y="216">segment 0002</text>
  <text class="muted tiny" x="620" y="241">active append</text>
  <rect class="record" x="608" y="258" width="34" height="30"/><rect class="record" x="648" y="258" width="34" height="30"/><rect class="record" x="688" y="258" width="34" height="30"/><rect class="record" x="728" y="258" width="34" height="30"/>

  <rect class="box" x="835" y="196" width="210" height="108"/>
  <text class="label" x="884" y="230">producer</text>
  <text class="muted small" x="874" y="260">new records append</text>
  <path class="line" d="M835 250 H790"/>

  <rect class="box delete" x="92" y="390" width="290" height="96"/>
  <text class="label" x="128" y="424">Delete retention</text>
  <text class="muted small" x="128" y="452">old closed segments are removed</text>
  <text class="muted small" x="128" y="474">by time or size policy</text>

  <rect class="box compact" x="424" y="390" width="300" height="96"/>
  <text class="label" x="462" y="424">Log compaction</text>
  <text class="muted small" x="462" y="452">keep latest record per key</text>
  <text class="muted small" x="462" y="474">tombstones remove deleted keys</text>

  <rect class="box" x="766" y="390" width="250" height="96"/>
  <text class="label" x="800" y="424">Consumer replay</text>
  <text class="muted small" x="800" y="452">offset can move backward</text>
  <text class="muted small" x="800" y="474">while retained data exists</text>
</svg>
