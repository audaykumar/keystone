<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">The metastable retry loop and how budgets break it</title>
  <desc id="desc">A feedback cycle where errors cause retries, retries raise load, load causes more errors. Jitter, timeout budgets, and retry budgets cut the cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
    <marker id="cut" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .muted { fill: #9ba7b4; }
      .small { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .title { font-size: 28px; font-weight: 750; }
      .bad { fill: #2d1b1e; stroke: #ff7b72; stroke-width: 2; }
      .good { fill: #14251d; stroke: #56d364; stroke-width: 2; }
      .loop { stroke: #ff7b72; stroke-width: 3.5; marker-end: url(#arrow); fill: none; }
      .fix { stroke: #56d364; stroke-width: 3; marker-end: url(#cut); fill: none; }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#0d1117"/>
  <text class="title" x="44" y="54">The metastable loop: retries feed the outage that causes them</text>
  <text class="muted small" x="44" y="84">The loop persists after the original trigger is gone. It only stops when load is actively shed.</text>

  <!-- four nodes of the cycle -->
  <rect class="bad" x="410" y="130" width="280" height="70" rx="12"/>
  <text class="label" x="470" y="165">Backend errors rise</text>
  <text class="small muted" x="452" y="187">a slow or failing dependency</text>

  <rect class="bad" x="770" y="270" width="270" height="70" rx="12"/>
  <text class="label" x="840" y="305">Callers retry</text>
  <text class="small muted" x="800" y="327">every failure becomes 2-9 calls</text>

  <rect class="bad" x="410" y="410" width="280" height="70" rx="12"/>
  <text class="label" x="452" y="445">Arrival rate climbs</text>
  <text class="small muted" x="452" y="467">now past the backend's capacity</text>

  <rect class="bad" x="60" y="270" width="270" height="70" rx="12"/>
  <text class="label" x="110" y="305">Latency + errors grow</text>
  <text class="small muted" x="92" y="327">overload makes it worse</text>

  <!-- clockwise loop arrows -->
  <path class="loop" d="M 690 175 C 780 195, 850 225, 895 266"/>
  <path class="loop" d="M 900 340 C 870 390, 780 415, 694 440"/>
  <path class="loop" d="M 410 452 C 320 432, 250 400, 202 344"/>
  <path class="loop" d="M 196 270 C 240 220, 330 190, 408 172"/>

  <!-- fixes cutting in -->
  <rect class="good" x="360" y="285" width="380" height="44" rx="10"/>
  <text class="small" x="378" y="313">jitter · timeout budget · retry budget · circuit breaker</text>
  <path class="fix" d="M 550 285 L 550 205"/>
  <path class="fix" d="M 550 329 L 550 408"/>

  <text class="muted small" x="44" y="560">Jitter decorrelates the retry wave. A timeout budget stops doomed retries. A retry budget caps retries as a fraction of traffic,</text>
  <text class="muted small" x="44" y="584">breaking the loop at its source. Together they turn collapse into degraded-but-serving.</text>
</svg>
