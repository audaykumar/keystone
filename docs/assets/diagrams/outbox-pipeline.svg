<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox pipeline</title>
  <desc id="desc">A service writes business state and an outbox row in one transaction, then a polling or CDC publisher sends committed events to a broker for idempotent consumers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ba7b4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .title { font-size: 28px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .muted { fill: #9ba7b4; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .blue { fill: #142236; stroke: #58a6ff; }
      .green { fill: #14251d; stroke: #56d364; }
      .yellow { fill: #2a2416; stroke: #e3b341; }
      .red { fill: #2d1b1e; stroke: #ff7b72; }
      .line { stroke: #9ba7b4; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .tx { fill: none; stroke: #56d364; stroke-width: 3; stroke-dasharray: 10 8; rx: 18; }
      .fail { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect width="1120" height="650" fill="#0d1117"/>
  <text class="title" x="44" y="54">Transactional outbox pipeline</text>
  <text class="muted small" x="44" y="84">The event is committed with local state, then published later by a resumable process.</text>

  <rect class="box blue" x="60" y="188" width="160" height="98"/>
  <text class="label" x="110" y="226">Service</text>
  <text class="muted small" x="88" y="252">handle request</text>
  <path class="line" d="M220 238 H295"/>

  <rect class="tx" x="292" y="140" width="360" height="210"/>
  <text class="label" x="325" y="176">One database transaction</text>
  <rect class="box green" x="330" y="215" width="130" height="76"/>
  <text class="label" x="362" y="247">State</text>
  <text class="muted tiny" x="354" y="270">business row</text>
  <rect class="box green" x="490" y="215" width="130" height="76"/>
  <text class="label" x="524" y="247">Outbox</text>
  <text class="muted tiny" x="514" y="270">event row</text>

  <path class="line" d="M652 238 H735"/>
  <rect class="box yellow" x="735" y="170" width="160" height="136"/>
  <text class="label" x="778" y="208">Relay</text>
  <text class="muted small" x="766" y="236">poll table</text>
  <text class="muted small" x="766" y="260">or tail WAL</text>

  <path class="line" d="M895 238 H975"/>
  <rect class="box blue" x="975" y="188" width="110" height="98"/>
  <text class="label" x="1000" y="226">Broker</text>
  <text class="muted tiny" x="998" y="252">topic / queue</text>

  <path class="line" d="M1030 286 V422 H880"/>
  <rect class="box green" x="690" y="390" width="190" height="92"/>
  <text class="label" x="724" y="424">Consumer</text>
  <text class="muted small" x="718" y="452">idempotent effect</text>

  <rect class="box red" x="78" y="410" width="480" height="118"/>
  <text class="label" x="110" y="444">Dual-write failure points avoided</text>
  <path class="fail" d="M130 482 H250"/>
  <text class="muted small" x="270" y="488">DB-first crash: state without event</text>
  <path class="fail" d="M130 512 H250"/>
  <text class="muted small" x="270" y="518">broker-first crash: event without state</text>

  <rect class="box" x="610" y="520" width="430" height="66"/>
  <text class="small" x="642" y="558">Remaining guarantee: publication is at-least-once, so consumers dedupe by event id.</text>
</svg>
