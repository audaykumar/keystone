<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">RabbitMQ routing: publisher, exchange, queue, competing consumers, and the dead-letter branch</title>
  <desc id="desc">A publisher sends to an exchange with a routing key. A binding routes matching messages into a queue. Two competing consumers pull from the same queue with manual ack. Acking removes the message. Nacking without requeue follows the dead-letter branch to a dead-letter exchange and its queue instead of being discarded.</desc>
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba7b4"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/>
    </marker>
    <marker id="arrowBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf3; }
      .muted { fill: #9ba7b4; }
      .small { font-size: 14px; }
      .label { font-size: 17px; font-weight: 700; }
      .title { font-size: 27px; font-weight: 750; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .good { fill: #14251d; stroke: #56d364; stroke-width: 2; }
      .bad { fill: #2d1b1e; stroke: #ff7b72; stroke-width: 2; }
      .flowEdge { stroke: #9ba7b4; stroke-width: 3; marker-end: url(#arrowMuted); fill: none; }
      .ackEdge { stroke: #56d364; stroke-width: 3; marker-end: url(#arrowGood); fill: none; }
      .deadEdge { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 7 6; marker-end: url(#arrowBad); fill: none; }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#0d1117"/>
  <text class="title" x="44" y="52">Exchange &#8594; queue &#8594; competing consumers</text>
  <text class="muted small" x="44" y="80">A queue deletes a message on ack. A nack without requeue takes the dead-letter branch instead of vanishing.</text>

  <!-- Publisher -->
  <rect class="box" x="40" y="230" width="150" height="100" rx="12"/>
  <text class="label" x="66" y="270">Publisher</text>
  <text class="small muted" x="66" y="296">routing key: work</text>

  <!-- Exchange -->
  <rect class="box" x="260" y="230" width="170" height="100" rx="12"/>
  <text class="label" x="286" y="266">lab.direct</text>
  <text class="small muted" x="286" y="290">direct exchange</text>
  <text class="small muted" x="286" y="310">binding: "work"</text>

  <!-- Queue -->
  <rect class="box" x="500" y="215" width="180" height="130" rx="12"/>
  <text class="label" x="524" y="252">work.queue</text>
  <text class="small muted" x="524" y="276">FIFO-ish, durable</text>
  <text class="small muted" x="524" y="296">holds unacked</text>
  <text class="small muted" x="524" y="316">deliveries too</text>

  <!-- Consumers (competing) -->
  <rect class="box" x="800" y="120" width="220" height="90" rx="12"/>
  <text class="label" x="826" y="156">Consumer A</text>
  <text class="small muted" x="826" y="180">manual ack, prefetch N</text>

  <rect class="box" x="800" y="320" width="220" height="90" rx="12"/>
  <text class="label" x="826" y="356">Consumer B</text>
  <text class="small muted" x="826" y="380">manual ack, prefetch N</text>

  <!-- flow: publisher -> exchange -> queue -> consumers -->
  <path class="flowEdge" d="M 190 280 L 258 280"/>
  <path class="flowEdge" d="M 430 280 L 498 280"/>
  <path class="flowEdge" d="M 680 255 C 740 220, 760 190, 798 168"/>
  <path class="flowEdge" d="M 680 305 C 740 340, 760 360, 798 368"/>

  <!-- ack path: consumer -> queue, message removed -->
  <path class="ackEdge" d="M 900 210 C 880 250, 780 230, 700 240"/>
  <text class="small" x="705" y="205" fill="#56d364">ack &#8594; delete from queue</text>

  <!-- dead-letter path: consumer nack(requeue=false) -> DLX -> DLQ -->
  <rect class="bad" x="800" y="470" width="150" height="90" rx="12"/>
  <text class="label" x="822" y="504">lab.dlx</text>
  <text class="small muted" x="822" y="528">dead-letter exchange</text>

  <rect class="bad" x="480" y="470" width="180" height="90" rx="12"/>
  <text class="label" x="504" y="504">work.dlq</text>
  <text class="small muted" x="504" y="528">held for inspection</text>

  <path class="deadEdge" d="M 900 410 C 890 440, 880 450, 875 468"/>
  <text class="small" x="700" y="440" fill="#ff7b72">nack(requeue=false)</text>
  <path class="deadEdge" d="M 798 515 L 662 515"/>
  <text class="small" x="670" y="460" fill="#ff7b72">bound to dead-letter routing key</text>

  <text class="muted small" x="44" y="570">Two consumers compete for the same queue: each message goes to exactly one of them, not both.</text>
  <text class="muted small" x="44" y="592">The dead-letter branch only fires on nack(requeue=false), reject, TTL expiry, or length-limit expiry, never on ack.</text>
</svg>
